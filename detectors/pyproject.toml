[project]
name = "guardrails-detectors"
version = "0.3.0"
requires-python = ">=3.11"
description = "A collection of detectors for the FMS Guardrails Orchestrator"
license = "Apache-2.0"

dependencies = [
    "urllib3==2.7.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
    "prometheus_client>=0.18.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
huggingface = [
    "transformers==4.57.6",
    "sentencepiece==0.2.2",
    "tiktoken==0.13.0",
    "torch==2.11.0",
]
built-in = [
    "markdown==3.10.3",
    "jsonschema==4.26.0",
    "xmlschema==4.3.2",
    "requests==2.34.2",
    "regex>=2024.0.0",
]
all = [
    "guardrails-detectors[huggingface,built-in]",
]
llm-judge = [
    "vllm-judge[jinja2]==0.1.8",
]
dev = [
    "coverage==7.15.4",
    "locust==2.46.3",
    "pre-commit==3.8.0",
    "pytest==8.4.2",
    "pytest-cov>=4.0",
    "tls-test-tools",
    "protobuf==6.33.6",
    "torch==2.11.0",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"detectors" = "."}
packages = ["detectors", "detectors.common", "detectors.huggingface", "detectors.llm_judge"]
